[package]
name = "minelab-linux-installer"
version = "0.2.1"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
indicatif = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1