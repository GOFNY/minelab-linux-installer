name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Get package info
        id: package
        run: |
          METADATA=$(cargo metadata --format-version 1 --no-deps)

          NAME=$(echo "$METADATA" | jq -r '.packages[0].name')
          VERSION=$(echo "$METADATA" | jq -r '.packages[0].version')

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: package
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

          - name: aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare binary
        env:
          NAME: ${{ needs.package.outputs.name }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.name }}
        run: |
          cp "target/$TARGET/release/$NAME" \
            "target/$NAME-linux-$ARCH"

          tar -czf "target/$NAME-linux-$ARCH.tar.gz" \
            -C target "$NAME-linux-$ARCH"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-${{ matrix.name }}
          path: target/${{ needs.package.outputs.name }}-linux-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    needs: [package, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          gh release create "$VERSION" dist/*.tar.gz \
            --title "$VERSION" \
            --generate-notes \
            --draft
